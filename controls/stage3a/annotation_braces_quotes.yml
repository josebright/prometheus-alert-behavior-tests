{
  "groups": [
    {
      "name": "R01",
      "interval": "1m",
      "rules": [
        {
          "alert": "ServiceErrorRatioHigh",
          "expr": "service_error_ratio > 0.05",
          "for": "2m",
          "annotations": {
            "summary": "brace {x} and [got: {y}], quote \"quoted\"; literal backslash \\ and newline\nnext"
          }
        }
      ]
    }
  ]
}
